services:
  front:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      api-nginx:
        condition: service_started

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    working_dir: /var/www
    command: >-
      sh -c "composer install --prefer-dist --no-interaction
      && mkdir -p config/jwt
      && php bin/console lexik:jwt:generate-keypair --skip-if-exists
      && php-fpm"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: mysql://progressia:progressia@database:3306/progressia?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    networks:
      - internal
    depends_on:
      database:
        condition: service_healthy

  api-nginx:
    image: nginx:alpine
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8087:80"
    networks:
      - internal
    depends_on:
      - php

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: progressia
      MARIADB_USER: progressia
      MARIADB_PASSWORD: progressia
      MARIADB_ROOT_PASSWORD: rootpwd
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - internal

networks:
  internal:

volumes:
  database_data:
  front_node_modules:
  backend_vendor:
