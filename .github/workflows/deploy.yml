name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: progressia-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build images and deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/front/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.progressia.app
          tags: |
            ghcr.io/dannebicque/progressia-front:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dannebicque/progressia-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/dannebicque/progressia-api:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dannebicque/progressia-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nginx/Dockerfile.api
          push: true
          tags: |
            ghcr.io/dannebicque/progressia-api-nginx:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dannebicque/progressia-api-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add VPS host key
        run: ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production compose file
        run: |
          ssh -p "${{ secrets.SSH_PORT || '22' }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.TARGET_COMPOSE_DIR || '/var/www/progressia' }}'"

          rsync -rlptvz \
            -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" \
            compose.prod.yaml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.TARGET_COMPOSE_DIR || '/var/www/progressia' }}/compose.prod.yaml"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            cd "${{ secrets.TARGET_COMPOSE_DIR || '/var/www/progressia' }}"

            test -f .env.prod.local || {
              echo ".env.prod.local is missing on the VPS"
              exit 1
            }

            mkdir -p jwt

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "APP_VERSION=${{ github.event.workflow_run.head_sha }}" > .env.version

            COMPOSE="docker compose --env-file .env.version -f compose.prod.yaml"

            $COMPOSE pull

            # Query MariaDB directly through PDO. DoctrineBundle 4 no longer
            # exposes the doctrine:query:sql console command.
            $COMPOSE run --rm --no-deps php php -r \
              '$u=parse_url(getenv("DATABASE_URL")); $pdo=new PDO("mysql:host=".$u["host"].";port=".($u["port"] ?? 3306).";dbname=".ltrim($u["path"], "/"), $u["user"], $u["pass"]); echo "Database version: ".$pdo->query("SELECT VERSION()")->fetchColumn().PHP_EOL;'

            $COMPOSE run --rm --no-deps php sh -lc \
              'composer show doctrine/dbal; composer show doctrine/migrations; composer show doctrine/orm'

            $COMPOSE run --rm --no-deps php \
              php bin/console lexik:jwt:generate-keypair --skip-if-exists

            # Migrations must succeed before the new application containers are
            # put online. A failure leaves the currently running version intact.
            $COMPOSE run --rm --no-deps php \
              php bin/console doctrine:migrations:migrate \
              --no-interaction \
              --allow-no-migration

            $COMPOSE up -d --remove-orphans

            $COMPOSE exec -T php \
              php bin/console cache:clear --env=prod

            $COMPOSE exec -T php \
              php bin/console cache:warmup --env=prod

            docker image prune -f
