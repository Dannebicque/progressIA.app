name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: progressia_test
          MARIADB_USER: progressia
          MARIADB_PASSWORD: progressia
          MARIADB_ROOT_PASSWORD: rootpwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      APP_SECRET: ci-secret
      # Doctrine appends `_test` in the test environment via doctrine.yaml.
      # Point the base URL at `progressia`; the effective database is therefore
      # `progressia_test`, which is the database created by the MariaDB service.
      DATABASE_URL: mysql://progressia:progressia@127.0.0.1:3306/progressia?serverVersion=11.4.0-MariaDB&charset=utf8mb4

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Lint YAML
        run: php bin/console lint:yaml config

      - name: Lint service container
        run: php bin/console lint:container

      - name: Show database and Doctrine versions
        run: |
          php -r '$u=parse_url(getenv("DATABASE_URL")); $pdo=new PDO("mysql:host=".$u["host"].";port=".($u["port"] ?? 3306).";dbname=".ltrim($u["path"], "/")."_test", $u["user"], $u["pass"]); echo "Database version: ".$pdo->query("SELECT VERSION()")->fetchColumn().PHP_EOL;'
          composer show doctrine/dbal
          composer show doctrine/migrations
          composer show doctrine/orm

      - name: Run migrations on a clean MariaDB database
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Validate Doctrine schema introspection
        run: php bin/console app:diagnose-schema
