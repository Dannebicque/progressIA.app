api_platform:
    title: PedagoFlow API
    version: 1.0.0
    # Plain JSON is the default so the Vue front can send/accept application/json;
    # JSON-LD and the HTML docs stay available.
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
